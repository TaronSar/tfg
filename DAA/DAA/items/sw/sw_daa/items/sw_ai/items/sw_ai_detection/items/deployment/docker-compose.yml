name: mlops_infra

x-cvat-backend-env: &cvat-backend-env
  CVAT_POSTGRES_HOST: cvat_db
  CVAT_REDIS_INMEM_HOST: cvat_redis_inmem
  CVAT_REDIS_INMEM_PORT: 6379
  CVAT_REDIS_ONDISK_HOST: cvat_redis_ondisk
  CVAT_REDIS_ONDISK_PORT: 6666
  CVAT_LOG_IMPORT_ERRORS: 'true'
  CVAT_ALLOW_STATIC_CACHE: '${CVAT_ALLOW_STATIC_CACHE:-no}'
  CVAT_ANALYTICS: "0"
  SMOKESCREEN_OPTS: ${SMOKESCREEN_OPTS:-}
  no_proxy: nuclio,opa,${no_proxy:-}

x-cvat-backend-deps: &cvat-backend-deps
  cvat_redis_inmem:
    condition: service_started
  cvat_redis_ondisk:
    condition: service_started
  cvat_db:
    condition: service_started

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.10.0
    container_name: mlflow
    ports:
      - "5000:5000"
    volumes:
      - ${LOCAL_NAS_PATH}/mlflow:/mlflow
    environment:
      - MLFLOW_ENABLE_SYSTEM_METRICS_LOGGING=false
    command: >
      mlflow server
        --host 0.0.0.0 --port 5000
        --backend-store-uri sqlite:///mlflow/mlflow.db
        --artifacts-destination /mlflow/artifacts
        --disable-security-middleware
    restart: unless-stopped

  fiftyone:
    container_name: fiftyone
    image: voxel51/fiftyone:1.13.4
    ports:
      - "5151:5151"
    volumes:
      - ${LOCAL_NAS_PATH}/fiftyone:/root/.fiftyone
      - ${LOCAL_NAS_PATH}:${LOCAL_NAS_PATH}
    environment:
      - FIFTYONE_DATABASE_URI=mongodb://mongodb_fiftyone:27017/fiftyone
      - FIFTYONE_HOME=/root/.fiftyone
      - FIFTYONE_DEFAULT_APP_PORT=5151
      - FIFTYONE_DEFAULT_APP_ADDRESS=0.0.0.0
      - FIFTYONE_SERVER_ADDRESS=0.0.0.0
      - FIFTYONE_SERVER_PORT=5151
    depends_on:
      - mongodb_fiftyone
    command: fiftyone app launch --port 5151 --address 0.0.0.0 --remote
    restart: unless-stopped

  mongodb_fiftyone:
    image: mongo:7
    container_name: mongodb_fiftyone
    ports:
      - 27017:27017
    volumes:
      - ${LOCAL_NAS_PATH}/mongodb:/data/db
    restart: unless-stopped

  cvat_db:
    container_name: cvat_db
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_DB: cvat
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - cvat_db:/var/lib/postgresql/data
    networks:
      - cvat

  cvat_redis_inmem:
    container_name: cvat_redis_inmem
    image: redis:7.2.11-alpine
    restart: always
    command: [ "redis-server", "--save", "60", "100", "--appendonly", "yes" ]
    volumes:
      - cvat_inmem_db:/data
    networks:
      - cvat

  cvat_redis_ondisk:
    container_name: cvat_redis_ondisk
    image: apache/kvrocks:2.12.1
    restart: always
    init: true
    volumes:
      - cvat_cache_db:/var/lib/kvrocks
    networks:
      - cvat
    command: [ "--compact-cron", "0 3 * * *" ]

  cvat_server:
    container_name: cvat_server
    image: cvat/server:v2.59.1
    restart: always
    depends_on:
      <<: *cvat-backend-deps
      cvat_opa:
        condition: service_started
    environment:
      <<: [ *cvat-backend-env ]
      DJANGO_MODWSGI_EXTRA_ARGS: ''
      ALLOWED_HOSTS: '*'
      ADAPTIVE_AUTO_ANNOTATION: 'false'
      NUMPROCS: 2
      CVAT_BASE_URL: ''
      ONE_RUNNING_JOB_IN_QUEUE_PER_USER: 'false'

    command: init run server
    labels:
      traefik.enable: "true"
      traefik.http.services.cvat.loadbalancer.server.port: "8080"
      traefik.http.routers.cvat.rule: PathPrefix(`/api/`) || PathPrefix(`/static/`) || PathPrefix(`/admin`) || PathPrefix(`/django-rq`)
      traefik.http.routers.cvat.entrypoints: web
      traefik.http.routers.cvat.priority: "100"
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs
      - cvat_share:/home/django/share
    networks:
      cvat:
        aliases:
          - cvat-server

  cvat_ui:
    container_name: cvat_ui
    image: cvat/ui:v2.59.1
    restart: always
    depends_on:
      - cvat_server
    labels:
      traefik.enable: "true"
      traefik.http.services.cvat-ui.loadbalancer.server.port: "8000"
      traefik.http.routers.cvat-ui.rule: PathPrefix(`/`)
      traefik.http.routers.cvat-ui.entrypoints: web
      traefik.http.routers.cvat-ui.priority: "1"
    networks:
      - cvat

  cvat_opa:
    container_name: cvat_opa
    image: openpolicyagent/opa:1.12.2
    restart: always
    networks:
      cvat:
        aliases:
          - opa
    command:
      - run
      - --server
      - --addr=:8181
      - --log-level=error
      - --set=services.cvat.url=http://cvat-server:8080
      - --set=bundles.cvat.service=cvat
      - --set=bundles.cvat.resource=/api/auth/rules
      - --set=bundles.cvat.polling.min_delay_seconds=5
      - --set=bundles.cvat.polling.max_delay_seconds=15

  cvat_worker_import:
    container_name: cvat_worker_import
    image: cvat/server:v2.59.1
    restart: always
    depends_on: *cvat-backend-deps
    environment:
      <<: *cvat-backend-env
      NUMPROCS: 2
    command: run worker import
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs
      - cvat_share:/home/django/share
    networks:
      - cvat

  cvat_worker_export:
    container_name: cvat_worker_export
    image: cvat/server:v2.59.1
    restart: always
    depends_on: *cvat-backend-deps
    environment:
      <<: *cvat-backend-env
      NUMPROCS: 2
    command: run worker export
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs
      - cvat_share:/home/django/share
    networks:
      - cvat

  cvat_worker_annotation:
    container_name: cvat_worker_annotation
    image: cvat/server:v2.59.1
    restart: always
    depends_on: *cvat-backend-deps
    environment:
      <<: *cvat-backend-env
      NUMPROCS: 1
    command: run worker annotation
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs
      - cvat_share:/home/django/share
    networks:
      - cvat
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # not needed until we want to use nuclio for auto-annotation or other serverless functions
  # nuclio:
  #   container_name: nuclio
  #   image: quay.io/nuclio/dashboard:1.15.9-amd64
  #   restart: always
  #   networks:
  #     - cvat
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   environment:
  #     http_proxy:
  #     https_proxy:
  #     no_proxy: ${no_proxy:-}
  #     NUCLIO_CHECK_FUNCTION_CONTAINERS_HEALTHINESS: 'true'
  #     NUCLIO_DASHBOARD_DEFAULT_FUNCTION_MOUNT_MODE: 'volume'
  #     NUCLIO_DASHBOARD_CONTAINER_NETWORK: cvat
  #     NUCLIO_CONTAINER_BUILDER_KIND: docker
  #   ports:
  #     - '8070:8070'

  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: always
    ports:
      - ${CVAT_EXTERNAL_PORT:-18080}:8080 # Main CVAT access point
      - ${TRAEFIK_DASHBOARD_EXTERNAL_PORT:-18090}:8090 # Optional Traefik dashboard
    environment:
      CVAT_HOST: ${CVAT_HOST:-localhost}
      TRAEFIK_LOG_FORMAT: json
      TRAEFIK_ENTRYPOINTS_web_ADDRESS: :8080
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: "false"
      TRAEFIK_PROVIDERS_DOCKER_NETWORK: cvat
      # Uncomment to get Traefik dashboard
      TRAEFIK_API_DASHBOARD: "true"
      TRAEFIK_ENTRYPOINTS_dashboard_ADDRESS: :8090
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.entrypoints: dashboard
      traefik.http.routers.dashboard.service: api@internal
      traefik.http.routers.dashboard.rule: PathPrefix(`/api`) || PathPrefix(`/dashboard`)
      traefik.http.routers.dashboard-root.entrypoints: dashboard
      traefik.http.routers.dashboard-root.rule: Path(`/`)
      traefik.http.routers.dashboard-root.middlewares: dashboard-redirect
      traefik.http.middlewares.dashboard-redirect.redirectregex.regex: ^http://([^/]+)/$
      traefik.http.middlewares.dashboard-redirect.redirectregex.replacement: http://$${1}/dashboard/
      traefik.http.middlewares.dashboard-redirect.redirectregex.permanent: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - cvat

volumes:
  cvat_db:
    driver_opts:
      type: none
      device: ${LOCAL_NAS_PATH}/cvat/db
      o: bind
  cvat_data:
    driver_opts:
      type: none
      device: ${LOCAL_NAS_PATH}/cvat/data
      o: bind
  cvat_keys:
    driver_opts:
      type: none
      device: ${LOCAL_NAS_PATH}/cvat/keys
      o: bind
  cvat_logs:
    driver_opts:
      type: none
      device: ${LOCAL_NAS_PATH}/cvat/logs
      o: bind
  cvat_inmem_db:
    driver_opts:
      type: none
      device: ${LOCAL_NAS_PATH}/cvat/redis_inmem
      o: bind
  cvat_cache_db:
    driver_opts:
      type: none
      device: ${LOCAL_NAS_PATH}/cvat/redis_ondisk
      o: bind
  cvat_share:
    driver_opts:
      type: none
      device: ${LOCAL_NAS_PATH}/datasets
      o: bind

networks:
  cvat:
    driver: bridge
