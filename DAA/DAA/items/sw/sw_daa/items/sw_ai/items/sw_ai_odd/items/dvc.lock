      size: 14762
    params:
      configs/dvc_config.yaml:
        dataset:
          classes:
          - Urban
          - Non-urban
          - Water
          mix_category: Mix
          prompts:
            Urban:
            - an aerial photo of a mostly dominated city view
            - an aerial photo with a significant amount of buildings, streets 
              and houses and little or no water present
            - an aerial photo of a mostly dominated urban area with roads and 
              rooftops without many natural features
            - an aerial photo of a town, suburb or medium size village without a
              lot of importance to the vegetation presence
            - an aerial photo of a residential or industrial neighbourhood
            - an aerial photo of a built-up area dominated by man-made 
              structures
            Non-urban:
            - an aerial photo of a forest sometimes with secondary presence of 
              roads or very few buildings
            - an aerial photo of trees, fields or mountains
            - an aerial photo of natural terrain such as woodland, grassland or 
              crops
            - an aerial photo of farmland, meadows or agricultural fields
            - an aerial photo of mountains, hills or rocky natural landscape
            - an aerial photo of vegetation, jungle or open countryside
            - an aerial photo of undeveloped natural land with no buildings
            - an aerial photo of a desert, dunes or barren ground
            Water:
            - an aerial photo of the ocean with no land or almost no land 
              visible
            - an aerial photo of a lake, river or sea
            - an aerial photo of a large body of water with no buildings or 
              urban structures
            - an aerial photo of waves or open water with no significant land
            - an aerial photo of the sea surface or a reservoir
            - an aerial photo dominated by water
            Mix:
            - an aerial photo of a coastline mixing water and land at even 
              proportions
            - an aerial photo showing the edge between an urban area and the 
              countryside
            - an aerial photo with a roughly equal mix of water, land and 
              buildings
            - an ambiguous aerial photo without land or water dominating the 
              scene because it is dominated by the sky
