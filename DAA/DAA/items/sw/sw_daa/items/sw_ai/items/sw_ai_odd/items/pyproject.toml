[project]
name = "ood-env"
version = "0.1.0"
description = "OOD background-classification pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.66.1",
    "mlflow==3.10.0",
    "pyyaml>=6.0.3",
    "fire==0.7.1",
    "loguru>=0.7.3",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "open-clip-torch>=3.3.0",
    "imagecorruptions>=1.1.2",
    "pytorch-ood>=0.3.1",
    "cleanlab[datalab]>=2.6",
    "timm>=1.0",
    "scikit-learn>=1.6.0",
    "joblib>=1.4.0",
    "setuptools>=70.0.0",
    "onnx>=1.21.0",
    "onnxruntime>=1.21.0",
    "tqdm>=4.67.0",
    "matplotlib>=3.10.9",
    "pycocotools>=2.0.11",
]

[dependency-groups]
dev = [
    "ruff>=0.15.7",
    "mypy>=1.15.0",
    "types-pyyaml>=6.0.0",
    "pytest>=9.0.2",
]
viz = [
    "fiftyone>=1.0",
    "python-dotenv>=1.2.2",
    "umap-learn>=0.5",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

exclude = [
    "build",
    "dist",
    '\\.venv',
]

[tool.pytest.ini_options]
minversion = "7.0"

addopts = [
    "-ra",
    "-q",
    "--strict-markers",
]

testpaths = [
    "test",
]

pythonpath = [
    ".",
]
