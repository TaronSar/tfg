# DAA system parameters
daa.n_tracks: 200
daa.max_pitch_correction: 15.0
daa.max_yaw_correction: 15.0
daa.th_min_area: 500.0
daa.th_max_area: 10000.0
daa.th_max_growth: 0.1 #0.08
daa.th_center_radius: 0.2
daa.w_area: 0.2
daa.w_area_growth: 0.2  # 0.3, 0.2
daa.w_vel: 0.2  # 0.2, 0.3
daa.center_gain: 2.0

# DAA TTC parameters
daa.ttc.cells_x: 5
daa.ttc.cells_y: 5
daa.ttc.th: 500.0

# DAA DBSCAN parameters
daa.dbscan.eps: 0.15 # 0.15, 0.12, 0.08
daa.dbscan.minpts: 5 # 8, 8, 6
daa.dbscan.ttc_w: 1.0 # 0.5
daa.dbscan.max_clusters: 50

# DAA Matcher parameters
daa.matcher.hamming_dist: 36
daa.matcher.lowe_dist_th: 0.85
daa.matcher.lk_gate_rad: 3.0

# Tracker parameters
tracker.iou_threshold: 0.25
tracker.max_missed: 5
tracker.ekf.sigma_position: 2.5
tracker.ekf.sigma_area: 0.10
tracker.ekf.sigma_meas_pos: 3.0
tracker.ekf.sigma_meas_area: 0.25
tracker.beta_aspect_ratio: 0.5

# PAT parameters
pat.window_size: 200
pat.mavlink_port: 14550
pat.rtsp_port: 8554

# Extrinsics parent:autopilot child:camera, by convention if we multiply yaw*pitch*roll, we build rotation from camera with respect to body, for transforming cam to body
camera.extrinsics.roll: 45.0 # 0.0 para Denied
camera.extrinsics.pitch: 0.0 # 45.0
camera.extrinsics.yaw: 90.0 #-90.0 para Denied
camera.extrinsics.x: 0.0
camera.extrinsics.y: 0.0
camera.extrinsics.z: 0.0

