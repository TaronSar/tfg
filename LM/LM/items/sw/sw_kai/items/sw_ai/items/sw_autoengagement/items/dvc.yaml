# =============================================================================
# DVC pipeline for few-shot UAV identification.
#
# This file is the PIPELINE RECIPE: one stage per processing step of the
# data-generation -> model-building workflow. The heavy image datasets live on
# the NAS (configs/dvc_config.yaml -> paths.datasets_root) and are NEVER
# `dvc add`-ed; each data stage writes its images to the NAS as a side effect
# and emits a small JSON manifest in data/ as its tracked `out` (mirroring
# sw_ai_detection). Editing the dataset does NOT churn dvc-storage.
#
# Conceptual workflow (8 steps):
#   1. Download GLB models      -> uav_models on NAS         (MANUAL; not a stage)
#   2. Synthetic rendering      -> 00_render
#   3. YOLOX cropping           -> 01_yolox_crops
#   4. Clean & audit            -> 02_filter_crops  (small-crop exclusion JSON)
#   5. Episodic ProtoNet train  -> 03_train
#   6. Open-set evaluation      -> 04_eval
#   (ONNX export / deployment are out of scope until the model is fully validated;
#    see scripts/export_onnx.py and src/uavid/export/ for future use)
#   7. Enrollment    } CLIENT-SIDE RUNTIME -- need client images; run via
#   8. Calibration   } scripts/enroll.py, calibrate_threshold.py, deploy_verify.py
#      + deployment  } (NOT dvc repro stages: not reproducible without client data)
#
# All stages are `frozen: true` (matching sw_ai_odd): `dvc repro` will NOT
# auto-rerun them when a dep (e.g. the dataset) changes. Each step is run
# DELIBERATELY -- by executing its script directly, or `dvc repro --force <stage>`.
# Run on the Vision server (RTX 5090, NAS mounted). `dvc push` BEFORE `git commit`.
# =============================================================================

vars:
  - configs/dvc_config.yaml

stages:

  # --- 2. Synthetic rendering (Blender) -------------------------------------
  # Renders operational + enrollment images for every GLB identity to the NAS.
  00_render:
    frozen: true
    cmd: >-
      PYTHONPATH=. uv run python scripts/batch_render.py
      --models_dir   ${paths.uav_models_root}
      --output_dir   ${paths.datasets_root}/${paths.renders_dataset}
      --blender      ${render.blender}
      --train_ratio  ${render.train_ratio}
      --samples      ${render.samples}
      --width        ${render.width}
      --height       ${render.height}
      --azimuths     ${render.azimuths}
      --elevations   ${render.elevations}
      --realistic
      --colorize     ${render.colorize}
      --operational_distance_mult ${render.operational_distance_mult}
      --operational_distance_jitter ${render.operational_distance_jitter}
      --manifest_out ${paths.manifests_dir}/00_render.json
    deps:
      - scripts/batch_render.py
      - scripts/render_uav.py
    params:
      - configs/dvc_config.yaml:
          - render
    outs:
      - ${paths.manifests_dir}/00_render.json

  # --- 3. YOLOX cropping -> ProtoNet-ready crop dataset ----------------------
  # Crops train/val frames with YOLOX; enrollment is copied uncropped (it is a
  # large-image support domain). Writes the crop dataset to the NAS.
  01_yolox_crops:
    frozen: true
    cmd: >-
      PYTHONPATH=. uv run python scripts/crop_from_yolox.py
      --model           ${paths.yolox_model}
      --raw_root        ${paths.datasets_root}/${paths.renders_dataset}
      --out_root        ${paths.datasets_root}/${paths.active_dataset}
      --copy_enrollment ${paths.datasets_root}/${paths.renders_dataset}/enrollment
      --manifest_out    ${paths.manifests_dir}/01_yolox_crops.json
    deps:
      - ${paths.manifests_dir}/00_render.json
      - scripts/crop_from_yolox.py
    outs:
      - ${paths.manifests_dir}/01_yolox_crops.json

  # --- 4. Clean & audit: small-crop exclusion list --------------------------
  # Records train/val crops below filter.min_px in a JSON exclusion list. Files
  # are NEVER deleted, so the dataset hash stays stable; the loader skips them.
  02_filter_crops:
    frozen: true
    cmd: >-
      PYTHONPATH=. uv run python scripts/filter_small_crops.py
      --data_root ${paths.datasets_root}/${paths.active_dataset}
      --out       ${paths.exclude_json}
      --min_px    ${filter.min_px}
      --splits    ${filter.splits}
    deps:
      - ${paths.manifests_dir}/01_yolox_crops.json
      - scripts/filter_small_crops.py
    params:
      - configs/dvc_config.yaml:
          - filter
    outs:
      - ${paths.exclude_json}

  # --- 5. Episodic ProtoNet training ----------------------------------------
  03_train:
    frozen: true
    cmd: >-
      PYTHONPATH=. uv run python scripts/train.py
      --data_root          ${paths.datasets_root}/${paths.active_dataset}
      --exclude_json       ${paths.exclude_json}
      --out                ${paths.models_dir}
      --support_split      ${train.support_split}
      --n_way              15
      --test_n_way         5
      --k_shot_range       ${train.k_shot_range}
      --q_query            5
      --epochs             50
      --episodes_per_epoch 200
      --lr                 0.001
      --backbone_lr        0.0001
      --metric             euclidean
      --degrade_p          0.0
      --embed_dim          ${train.embed_dim}
      --image_size         ${operational.model_input_size}
    deps:
      - ${paths.exclude_json}
      - scripts/train.py
    params:
      - configs/dvc_config.yaml:
          - train.support_split
          - train.k_shot_range
          - train.embed_dim
          - operational.model_input_size
    outs:
      - ${paths.models_dir}/best.pth
      - ${paths.models_dir}/last.pth

  # --- 6. Open-set evaluation (k-shot sweep) --------------------------------
  04_eval:
    frozen: true
    cmd: >-
      PYTHONPATH=. uv run python scripts/evaluate.py
      --data_root     ${paths.datasets_root}/${paths.active_dataset}
      --exclude_json  ${paths.exclude_json}
      --checkpoint    ${paths.models_dir}/best.pth
      --split         ${eval.split}
      --gallery_split ${train.support_split}
      --k_shots       ${eval.k_shots}
      --agg           ${eval.agg}
      --report_dir    ${paths.eval_dir}
    deps:
      - ${paths.exclude_json}
      - scripts/evaluate.py
      - ${paths.models_dir}/best.pth
    params:
      - configs/dvc_config.yaml:
          - eval
          - train.support_split
    outs:
      - ${paths.eval_dir}/openset_results.csv:
          cache: true
    metrics:
      - ${paths.eval_dir}/openset_summary.json:
          cache: true

  # --- 5. Phase 1: DINOv2 ViT-S/14 training (no hardware constraints) ------
  # backbone=dinov2_vits14 downloads ~330 MB weights on first run (needs internet).
  # degrade_p=0.5 ensures the model never sees more detail than the sensor.
  # Outputs to a separate models/ dir so the Phase 0 checkpoint is untouched.
  03_train_dinov2_vits14:
    frozen: true
    cmd: >-
      PYTHONPATH=. uv run python scripts/train.py
      --data_root          ${paths.datasets_root}/${paths.active_dataset}
      --exclude_json       ${paths.exclude_json}
      --out                models/01_dinov2_vits14
      --support_split      ${train.support_split}
      --backbone           dinov2_vits14
      --n_way              15
      --test_n_way         5
      --k_shot_range       ${train.k_shot_range}
      --q_query            5
      --epochs             30
      --episodes_per_epoch 200
      --lr                 0.001
      --backbone_lr        0.00005
      --embed_dim          128
      --image_size         224
      --degrade_p          0.5
      --freeze_backbone_epochs 5
    deps:
      - ${paths.exclude_json}
      - scripts/train.py
      - src/uavid/model/encoder.py
    params:
      - configs/dvc_config.yaml:
          - train.support_split
          - train.k_shot_range
          - operational.model_input_size
    outs:
      - models/01_dinov2_vits14/best.pth
      - models/01_dinov2_vits14/last.pth

  # --- 6. Phase 1: Open-set evaluation for DINOv2 ViT-S/14 -----------------
  04_eval_dinov2_vits14:
    frozen: true
    cmd: >-
      PYTHONPATH=. uv run python scripts/evaluate.py
      --data_root     ${paths.datasets_root}/${paths.active_dataset}
      --exclude_json  ${paths.exclude_json}
      --checkpoint    models/01_dinov2_vits14/best.pth
      --split         ${eval.split}
      --gallery_split ${train.support_split}
      --k_shots       ${eval.k_shots}
      --agg           ${eval.agg}
      --report_dir    data/eval_dinov2_vits14
    deps:
      - ${paths.exclude_json}
      - scripts/evaluate.py
      - models/01_dinov2_vits14/best.pth
    params:
      - configs/dvc_config.yaml:
          - eval
          - train.support_split
    outs:
      - data/eval_dinov2_vits14/openset_results.csv:
          cache: true
    metrics:
      - data/eval_dinov2_vits14/openset_summary.json:
          cache: true

  # --- 7. Phase 1 v2: DINOv2 ViT-S/14 + enrollment split, full fine-tune ---
  # Key changes vs 03_train_dinov2_vits14:
  #   q_query 5  (q_query=15 caused OOM at epoch 6 on 32GB 5090; peak ~18GB fits)
  #   episodes_per_epoch 400
  #   backbone_lr 0.00001  (gentler fine-tune of pre-trained weights)
  #   degrade_p 0.0        (enrollment images are high-res; no sensor sim)
  #   grad_accum 4         (effective batch = 4 episodes per optimizer step)
  #   support_split hardcoded to enrollment (not via dvc_config interpolation)
  #   PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True  (reduces fragmentation)
  03_train_dinov2_vits14_enrollment:
    frozen: true
    cmd: >-
      PYTHONPATH=. PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      uv run python scripts/train.py
      --data_root          ${paths.datasets_root}/${paths.active_dataset}
      --exclude_json       ${paths.exclude_json}
      --out                models/02_dinov2_vits14_enrollment
      --support_split      enrollment
      --backbone           dinov2_vits14
      --n_way              15
      --test_n_way         5
      --k_shot_range       1,3,5,10,15
      --q_query            5
      --epochs             30
      --episodes_per_epoch 400
      --lr                 0.001
      --backbone_lr        0.00001
      --embed_dim          128
      --image_size         224
      --degrade_p          0.0
      --freeze_backbone_epochs 5
      --grad_accum         4
    deps:
      - ${paths.exclude_json}
      - scripts/train.py
      - src/uavid/train/trainer.py
      - src/uavid/model/encoder.py
    outs:
      - models/02_dinov2_vits14_enrollment/best.pth
      - models/02_dinov2_vits14_enrollment/last.pth

  # --- 8. Evaluation for 03_train_dinov2_vits14_enrollment ------------------
  04_eval_dinov2_vits14_enrollment:
    frozen: true
    cmd: >-
      PYTHONPATH=. uv run python scripts/eval_kshot_sweep.py
      --checkpoint models/02_dinov2_vits14_enrollment/best.pth
      --data_root  ${paths.datasets_root}/${paths.active_dataset}
      --gallery_split enrollment
      --split      val
      --agg        mean
      --k_shots    1 3 5 10 15
      --out_csv    data/eval_dinov2_vits14_enrollment/openset_results.csv
      --out_graph  data/eval_dinov2_vits14_enrollment/kshot_sweep.png
    deps:
      - scripts/eval_kshot_sweep.py
      - models/02_dinov2_vits14_enrollment/best.pth
    outs:
      - data/eval_dinov2_vits14_enrollment/openset_results.csv:
          cache: true
      - data/eval_dinov2_vits14_enrollment/kshot_sweep.png:
          cache: true

  # --- 9. Same-split evaluation (gallery=val, query=val, standard few-shot) -
  # Complement to 04_eval_dinov2_vits14_enrollment: no dedicated enrollment,
  # gallery and query come from the same val pool (k_shot images enrolled,
  # remainder used as queries).
  04_eval_dinov2_vits14_same_split:
    frozen: true
    cmd: >-
      PYTHONPATH=. uv run python scripts/eval_kshot_sweep.py
      --checkpoint models/02_dinov2_vits14_enrollment/best.pth
      --data_root  ${paths.datasets_root}/${paths.active_dataset}
      --split      val
      --agg        mean
      --k_shots    1 3 5 10 15
      --out_csv    data/eval_dinov2_vits14_same_split/openset_results.csv
      --out_graph  data/eval_dinov2_vits14_same_split/kshot_sweep.png
    deps:
      - scripts/eval_kshot_sweep.py
      - models/02_dinov2_vits14_enrollment/best.pth
    outs:
      - data/eval_dinov2_vits14_same_split/openset_results.csv:
          cache: true
      - data/eval_dinov2_vits14_same_split/kshot_sweep.png:
          cache: true

  # --- 10. Confusability matrix (DINOv2 checkpoint, val split) --------------
  # Step 1 of 2 for hard-pair AUC: compute cosine similarity between all val
  # identity pairs to find the hardest (most look-alike) pairs.
  05_confusability_dinov2_val:
    frozen: true
    cmd: >-
      PYTHONPATH=. uv run python scripts/confusability.py
      --data_root  ${paths.datasets_root}/${paths.active_dataset}
      --checkpoint models/02_dinov2_vits14_enrollment/best.pth
      --split      val
      --top_k      10
      --report_dir data/eval_dinov2_vits14_enrollment
    deps:
      - scripts/confusability.py
      - models/02_dinov2_vits14_enrollment/best.pth
    outs:
      - data/eval_dinov2_vits14_enrollment/confusability_val.csv:
          cache: true
      - data/eval_dinov2_vits14_enrollment/confusability_val_summary.json:
          cache: true

  # --- 11. Hard-pair AUC (DINOv2, top-6 hardest val pairs) -----------------
  # Step 2 of 2: pairwise verification AUC for the top-6 hardest pairs.
  # Key pair to watch: orbiter-2m vs shahed (was 0.660 with MobileNetV3).
  05_hardpair_auc_dinov2_val:
    frozen: true
    cmd: >-
      PYTHONPATH=. uv run python scripts/hardpair_auc.py
      --data_root          ${paths.datasets_root}/${paths.active_dataset}
      --checkpoint         models/02_dinov2_vits14_enrollment/best.pth
      --confusability_csv  data/eval_dinov2_vits14_enrollment/confusability_val.csv
      --split              val
      --top_k              6
      --report_dir         data/eval_dinov2_vits14_enrollment
    deps:
      - scripts/hardpair_auc.py
      - models/02_dinov2_vits14_enrollment/best.pth
      - data/eval_dinov2_vits14_enrollment/confusability_val.csv
    outs:
      - data/eval_dinov2_vits14_enrollment/hardpair_auc_val.csv:
          cache: true
    metrics:
      - data/eval_dinov2_vits14_enrollment/hardpair_auc_val_summary.json:
          cache: true

  # ==========================================================================
  # VIDEO → YOLOX CROPS PIPELINE
  #
  # Pattern for every new .mp4 sighting:
  #
  #   Step A — extract frames:
  #     07_extract_<video>_frames:  extract_frames.py --video ... --output ...
  #   Step B — YOLOX crop:
  #     07_yolox_<video>:           crop_from_yolox.py --flat ... --identity ...
  #
  # Then add the crop folder as a dep/query in the demo stage below.
  # Copy-paste the two blocks and replace <video> / paths for each new file.
  # ==========================================================================

  # --- Skywalker X8 video ---------------------------------------------------
  07_extract_skywalker_x8_frames:
    frozen: true
    cmd: >-
      PYTHONPATH=. uv run python scripts/extract_frames.py
      --video   /mnt/Pool_IA/IA_Dataset/datasets/uav-few-shot-identification/demo/skywalker_x8.mp4
      --output  data/demo/skywalker_x8/frames
      --every_sec 0.5
      --max_frames 120
      --overwrite
    deps:
      - scripts/extract_frames.py
    outs:
      - data/demo/skywalker_x8/frames

  07_yolox_skywalker_x8:
    frozen: true
    cmd: >-
      PYTHONPATH=. uv run python scripts/crop_from_yolox.py
      --model    ${paths.yolox_model}
      --flat     data/demo/skywalker_x8/frames
      --identity skywalker_x8
      --split    train
      --out_root data/demo/skywalker_x8/crops
      --min_px   15
    deps:
      - scripts/crop_from_yolox.py
      - data/demo/skywalker_x8/frames
    params:
      - configs/dvc_config.yaml:
          - paths.yolox_model
    outs:
      - data/demo/skywalker_x8/crops

  # --- Hornet video ---------------------------------------------------------
  07_extract_hornet_frames:
    frozen: true
    cmd: >-
      PYTHONPATH=. uv run python scripts/extract_frames.py
      --video   /mnt/Pool_IA/IA_Dataset/datasets/uav-few-shot-identification/demo/video_hornet.mp4
      --output  data/demo/hornet/frames
      --every_sec 0.5
      --max_frames 120
      --overwrite
    deps:
      - scripts/extract_frames.py
    outs:
      - data/demo/hornet/frames

  07_yolox_hornet:
    frozen: true
    cmd: >-
      PYTHONPATH=. uv run python scripts/crop_from_yolox.py
      --model    ${paths.yolox_model}
      --flat     data/demo/hornet/frames
      --identity hornet
      --split    train
      --out_root data/demo/hornet/crops
      --min_px   15
    deps:
      - scripts/crop_from_yolox.py
      - data/demo/hornet/frames
    params:
      - configs/dvc_config.yaml:
          - paths.yolox_model
    outs:
      - data/demo/hornet/crops

  # --- Skywalker vs Hornet discrimination demo (DINOv2) ---------------------
  # Enrollment: close Skywalker reference images (not from video).
  # Candidates: YOLOX crops from Skywalker video (genuine) and Hornet (impostor).
  # MobileNetV3 gap was 0.066 — DINOv2 should widen it significantly.
  07_demo_dinov2_skywalker_vs_hornet:
    frozen: true
    cmd: >-
      mkdir -p data/demo/query_candidates/skywalker_x8 data/demo/query_candidates/hornet &&
      cp -rn data/demo/skywalker_x8/crops/train/skywalker_x8/. data/demo/query_candidates/skywalker_x8/ 2>/dev/null || true &&
      cp -rn data/demo/hornet/crops/train/hornet/. data/demo/query_candidates/hornet/ 2>/dev/null || true &&
      PYTHONPATH=. uv run python scripts/demo_real_world.py
      --checkpoint  models/02_dinov2_vits14_enrollment/best.pth
      --enrollment  /mnt/Pool_IA/IA_Dataset/datasets/uav-few-shot-identification/demo/video_demo_enrollment/skywalker_x8
      --queries     data/demo/query_candidates
      --gallery_out data/demo/dinov2_skywalker_gallery.npy
      --csv_out     data/demo/dinov2_skywalker_vs_hornet.csv
      --agg mean
    deps:
      - scripts/demo_real_world.py
      - models/02_dinov2_vits14_enrollment/best.pth
      - data/demo/skywalker_x8/crops
      - data/demo/hornet/crops
    outs:
      - data/demo/dinov2_skywalker_vs_hornet.csv:
          cache: true

  # ==========================================================================
  # PHASE 2 — HARD-NEGATIVE EPISODIC MINING
  #
  # Motivation (from Phase 0/1 baseline): orbiter-2m and shahed are the
  # hardest confusable pair in val (AUC 0.848 and 0.932 respectively).
  # Training episodes rarely contain both at once by chance (with 42 train
  # identities and n_way=15, the probability of sampling any specific pair
  # is ~2*(15/42)*(14/41) ≈ 27%). Hard-negative mining raises this to 50%
  # for the identities the model currently confuses most.
  #
  # Workflow:
  #   Step 1: run 08_confusability_train_dinov2 -> confusability_train.csv
  #   Step 2: inspect top rows of that CSV (hardest training identity pairs)
  #   Step 3: fill --hard_negatives below with the top-4 train identity names
  #   Step 4: run 08_train_phase2_hardneg
  # ==========================================================================

  # --- Phase 2, Step 1: Confusability on train split (DINOv2 checkpoint) ---
  08_confusability_train_dinov2:
    frozen: true
    cmd: >-
      PYTHONPATH=. uv run python scripts/confusability.py
      --data_root  ${paths.datasets_root}/${paths.active_dataset}
      --checkpoint models/02_dinov2_vits14_enrollment/best.pth
      --split      train
      --top_k      10
      --report_dir data/eval_phase2
    deps:
      - scripts/confusability.py
      - models/02_dinov2_vits14_enrollment/best.pth
    outs:
      - data/eval_phase2/confusability_train.csv:
          cache: true
      - data/eval_phase2/confusability_train_summary.json:
          cache: true

  # --- Phase 2, Step 2: Training with hard-negative episodic mining ---------
  # Fill --hard_negatives with the top-4 hardest TRAIN identity names from
  # data/eval_phase2/confusability_train.csv (identity_a,identity_b columns).
  # Example: --hard_negatives "lancet,baykar_bayraktar_tb2,uav_2,uav_bl"
  08_train_phase2_hardneg:
    frozen: true
    cmd: >-
      PYTHONPATH=. PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      uv run python scripts/train.py
      --data_root          ${paths.datasets_root}/${paths.active_dataset}
      --exclude_json       ${paths.exclude_json}
      --out                models/03_dinov2_phase2_hardneg
      --support_split      enrollment
      --backbone           dinov2_vits14
      --n_way              15
      --test_n_way         5
      --k_shot_range       1,3,5,10,15
      --q_query            5
      --epochs             50
      --episodes_per_epoch 400
      --lr                 0.00002
      --backbone_lr        0.000005
      --embed_dim          128
      --image_size         224
      --degrade_p          0.0
      --freeze_backbone_epochs 0
      --hard_negatives     morok_uav_drone_3d_model,neg_kf-280_uav,uav_2,uav_bl
      --hard_negative_p    0.5
      --resume             models/02_dinov2_vits14_enrollment/best.pth
    deps:
      - ${paths.exclude_json}
      - scripts/train.py
      - src/uavid/train/trainer.py
      - src/uavid/dataset/episodic.py
      - models/02_dinov2_vits14_enrollment/best.pth
    outs:
      - models/03_dinov2_phase2_hardneg/best.pth
      - models/03_dinov2_phase2_hardneg/last.pth

  # --- Phase 2, Step 3: Evaluation ------------------------------------------
  08_eval_phase2_hardneg:
    frozen: true
    cmd: >-
      PYTHONPATH=. uv run python scripts/eval_kshot_sweep.py
      --checkpoint models/03_dinov2_phase2_hardneg/best.pth
      --data_root  ${paths.datasets_root}/${paths.active_dataset}
      --gallery_split enrollment
      --split      val
      --agg        mean
      --k_shots    1 3 5 10 15
      --out_csv    data/eval_phase2/openset_results.csv
      --out_graph  data/eval_phase2/kshot_sweep.png
    deps:
      - scripts/eval_kshot_sweep.py
      - models/03_dinov2_phase2_hardneg/best.pth
    outs:
      - data/eval_phase2/openset_results.csv:
          cache: true
      - data/eval_phase2/kshot_sweep.png:
          cache: true

  # --- 9. Cross-domain k-shot sweep: 02_enrollment checkpoint, yolox_crops val ---
  04_eval_dinov2_vits14_enrollment_cross:
    frozen: true
    cmd: >-
      PYTHONPATH=. uv run python scripts/eval_kshot_sweep.py
      --checkpoint    models/02_dinov2_vits14_enrollment/best.pth
      --data_root     ${paths.datasets_root}/${paths.active_dataset}
      --gallery_split enrollment
      --split         val
      --agg           mean
      --k_shots       1 3 5 10 15
      --out_csv       logs/eval_dinov2_mixed_domain_cross.csv
    deps:
      - scripts/eval_kshot_sweep.py
      - models/02_dinov2_vits14_enrollment/best.pth
    outs:
      - logs/eval_dinov2_mixed_domain_cross.csv:
          cache: true
