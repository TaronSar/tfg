# DAA system parameters
daa.n_tracks: 200
daa.max_pitch_correction: 15.0
daa.max_yaw_correction: 15.0
daa.th_min_area: 500.0
daa.th_max_area: 10000.0
daa.th_max_growth: 0.1 #0.08
daa.th_center_radius: 0.2
daa.w_area: 0.2
daa.w_area_growth: 0.2  # 0.3, 0.2
daa.w_vel: 0.2  # 0.2, 0.3
daa.center_gain: 2.0

# DAA TTC parameters
daa.ttc.cells_x: 5
daa.ttc.cells_y: 5
daa.ttc.th: 500.0

# DAA DBSCAN parameters
daa.dbscan.eps: 0.15 # 0.15, 0.12, 0.08
daa.dbscan.minpts: 5 # 8, 8, 6
daa.dbscan.ttc_w: 1.0 # 0.5
daa.dbscan.max_clusters: 50

#DAA Matcher parameters
daa.matcher.hamming_dist: 36
daa.matcher.lowe_dist_th: 0.85
daa.matcher.lk_gate_rad: 3.0

# DAA tracker parameters
daa.tracker.iou_threshold: 0.25
daa.tracker.max_missed: 5
daa.tracker.ekf.sigma_position: 2.5
daa.tracker.ekf.sigma_area: 0.10
daa.tracker.ekf.sigma_meas_pos: 3.0
daa.tracker.ekf.sigma_meas_area: 0.25
daa.tracker.beta_aspect_ratio: 0.5

# PAT parameters
pat.window_size: 200
pat.mavlink_port: 14550
pat.rtsp_port: 8554
pat.detector.multi_enabled: 0
pat.detector.size_threshold: 64

# VO parameters
vo.max_inliers: 1000
vo.ransac_iterations: 100
vo.ransac_min_iterations: 30
vo.ransac_error_threshold: 2.0
vo.min_good_threshold: 0
vo.rotation_compensation: 1
vo.solver_mode: 0
# Height-above-ground metric scale.
# altitude_is_agl: 0 = telemetry altitude is absolute (WGS84/MSL); the terrain
#   elevation below is subtracted. 1 = autopilot already provides AGL altitude
#   (terrain_elevation_m is then ignored). Next flight will use AGL -> set to 1.
# terrain_elevation_m: ground elevation of the operating area (MSL metres).
vo.altitude_is_agl: 0
vo.terrain_elevation_m: 303.0

# Adaptive baseline (keyframe-by-parallax).
# adaptive_baseline: 1 = pick an older frame so the ground parallax reaches the
#   reconstruction threshold (robust triangulation); 0 = always use the previous
#   frame. baseline_max_lookback: cap on how many frames the search walks back
#   (must stay below the capture queue depth, 12).
vo.adaptive_baseline: 1
vo.baseline_max_lookback: 10

# Minimum triangulated ground points for a reliable AGL metric scale.
# Frames with fewer points have near-degenerate depth medians that over-scale
# the baseline; they fall back to the GPS-displacement scale.
vo.agl_min_tri_points: 50

# Robust temporal scale filter: clamps non-physical per-frame speed spikes
# (over-scaled AGL baselines) to the rolling-median band [median/factor,
# median*factor]. Operates on speed (metric_baseline / dt).
vo.scale_filter_enabled: 1
vo.scale_median_window: 15
vo.scale_reject_factor: 1.5

# Matcher spatial candidate window (px). Must span the adaptive-baseline
# parallax disparity; the legacy 10 px window starves ~half the frames of
# matches once the baseline widens. 30 px covers the median ~10 px disparity
# plus the larger edge/low-altitude flow.
vo.match_search_radius: 30

# Extrinsics parent:autopilot child:camera
camera.extrinsics.roll: 0.0
camera.extrinsics.pitch: 0.0
camera.extrinsics.yaw: 90.0
camera.extrinsics.x: 0.0
camera.extrinsics.y: 0.0
camera.extrinsics.z: 0.0

# Enconder params
encoder.Bitrate: 4000
encoder.VbvMaxBitrate: 4000
encoder.VbvBufferSize: 4000
encoder.KeyintMax: 1
encoder.FPS: 30
encoder.Threads: 1  # NOT CHANGE
encoder.CoreId: 0
encoder.Preset: ultrafast
encoder.Tune: zerolatency
